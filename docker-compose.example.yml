services:
  cd2-feishu-relay:
    image: python:3.11-alpine
    container_name: cd2-feishu-relay
    restart: unless-stopped
    ports:
      - "9095:9090"
    environment:
      - FEISHU_WEBHOOK=your_feishu_webhook_url_here
      - LISTEN_PORT=9090
    volumes:
      - ./server.py:/app/server.py
    working_dir: /app
    command: python3 server.py